name: Probe dynamic secret

on:
  workflow_dispatch:
    inputs:
      account_name:
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try fromJSON(toJSON(secrets)) dynamic lookup
        env:
          ALL: ${{ toJSON(secrets) }}
          DYNAMIC: ${{ fromJSON(toJSON(secrets))[format('{0}_TOKEN', inputs.account_name)] }}
        run: |
          echo "keys visible in toJSON(secrets): $(echo "$ALL" | python3 -c 'import json,sys; print(sorted(json.load(sys.stdin).keys()))')"
          if [ -n "$DYNAMIC" ]; then
            echo "DYNAMIC_LOOKUP=WORKS len=${#DYNAMIC}"
          else
            echo "DYNAMIC_LOOKUP=EMPTY"
          fi

      - name: Try secrets[format(...)] direct index
        env:
          INDEXED: ${{ secrets[format('{0}_TOKEN', inputs.account_name)] }}
        run: |
          if [ -n "$INDEXED" ]; then
            echo "INDEX_SYNTAX=WORKS len=${#INDEXED}"
          else
            echo "INDEX_SYNTAX=EMPTY"
          fi
