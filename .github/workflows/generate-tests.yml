name: Generate Test Cases with Claude

run-name: "Generate Test Cases [${{ github.event.inputs.correlation_id || 'auto' }}]"

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt describing how the test-cases-generator-tool and Claude should analyze the codebase'
        required: true
        type: string
      correlation_id:
        description: 'Client-supplied ID used to identify and poll this specific run'
        required: true
        type: string

jobs:
  generate-test-cases:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout the codebase to analyze
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          path: codebase

      # 2. Checkout the agentic tool repo
      - name: Checkout test-cases-generator-demo
        uses: actions/checkout@v4
        with:
          repository: AtefSaber-sheen/test-cases-generator-demo
          path: agent-tool

      # 3. Node is required by the Claude Code CLI
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Install the Claude Code CLI globally
      - name: Install Claude Code
        env:
          CID: ${{ github.event.inputs.correlation_id }}
        run: |
          echo "[cid:$CID] Installing Claude Code CLI..."
          npm install -g @anthropic-ai/claude-code
          claude --version || true

      # 5. Build the prompt file
      - name: Build prompt
        env:
          PROMPT_INPUT: ${{ github.event.inputs.prompt }}
          CID: ${{ github.event.inputs.correlation_id }}
        run: |
          echo "[cid:$CID] Building prompt..."
          if [ -n "$PROMPT_INPUT" ]; then
            printf '%s\n' "$PROMPT_INPUT" > prompt.txt
          else
            printf '%s\n' "You are acting as the test-cases-generator-tool defined in the test-cases-generator-demo repository. Analyze the codebase in ./codebase and produce a structured set of test cases. Write the result to codebase/test-cases.md." > prompt.txt
          fi
          echo "[cid:$CID] ---- Prompt used ----"
          cat prompt.txt

      # 6. Run Claude Code headlessly with the setup token.
      #    -p runs in non-interactive "print" mode.
      #    --permission-mode / --dangerously-skip-permissions is needed so it
      #    can write files without an interactive approval prompt in CI.
      - name: Run Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CID: ${{ github.event.inputs.correlation_id }}
        run: |
          echo "[cid:$CID] Running Claude Code..."
          cd codebase
          claude -p "$(cat ../prompt.txt)" \
            --dangerously-skip-permissions \
            --output-format text \
            2>&1 | tee ../claude-output.log
          echo "[cid:$CID] Claude Code finished."

      # 7. Collect everything the generator produced. The tool writes its
      #    results (md + csv) into an "out" folder; we copy that whole tree,
      #    plus sweep up any stray md/csv written elsewhere in the codebase,
      #    plus the raw CLI log as a fallback.
      - name: Collect outputs
        if: always()
        env:
          CID: ${{ github.event.inputs.correlation_id }}
        run: |
          mkdir -p output

          # a) The tool's main output folder, if it exists.
          #    Checks a few common locations/names.
          for d in codebase/out codebase/output codebase/outputs out output; do
            if [ -d "$d" ]; then
              echo "[cid:$CID] Found output folder: $d"
              cp -r "$d/." output/
            fi
          done

          # b) Any md/csv generated anywhere in the codebase that weren't
          #    already part of the original checkout (best-effort sweep).
          cd codebase
          for f in $(git ls-files --others --exclude-standard | grep -Ei '\.(md|csv)$' || true); do
            echo "[cid:$CID] Found generated file: $f"
            mkdir -p "../output/$(dirname "$f")"
            cp "$f" "../output/$f"
          done
          cd ..

          # c) Raw CLI log as a fallback if nothing else was written.
          if [ -f claude-output.log ]; then
            cp claude-output.log output/
          fi

          echo "[cid:$CID] ---- Collected files ----"
          find output -type f | sort

      # 8. Upload results, tagged with the correlation id
      - name: Upload test cases artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-test-cases-${{ github.event.inputs.correlation_id }}
          path: output/

      - name: Log completion
        if: always()
        run: echo "[cid:${{ github.event.inputs.correlation_id }}] Workflow run finished with status ${{ job.status }}"
