name: Generate Test Cases with Claude

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt describing how the test-cases-generator-tool and Claude should analyze the codebase'
        required: true
        type: string
  pull_request:
    branches: [main]

jobs:
  generate-test-cases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 1. Checkout the codebase to analyze
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          path: codebase

      # 2. Checkout the agentic tool repo
      - name: Checkout test-cases-generator-demo
        uses: actions/checkout@v4
        with:
          repository: AtefSaber-sheen/test-cases-generator-demo
          path: agent-tool

      # 3. Build the prompt file. If triggered manually via curl, use the
      #    supplied input. Otherwise (e.g. pull_request trigger) fall back
      #    to a default prompt.
      - name: Build prompt
        env:
          PROMPT_INPUT: ${{ github.event.inputs.prompt }}
        run: |
          if [ -n "$PROMPT_INPUT" ]; then
            printf '%s\n' "$PROMPT_INPUT" > prompt.txt
          else
            {
              echo "You are acting as the test-cases-generator-tool defined in the"
              echo "test-cases-generator-demo repository. Follow its methodology to"
              echo "analyze the codebase in the ./codebase directory and produce a"
              echo "structured set of test cases (unit, integration, and edge cases"
              echo "as appropriate). Write the result to codebase/test-cases.md."
            } > prompt.txt
          fi
          echo "---- Prompt used ----"
          cat prompt.txt

      # 4. Run Claude Code using the Team-plan OAuth token
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: prompt.txt
          working_directory: codebase

      # 5. Upload result as artifact
      - name: Upload test cases artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-test-cases
          path: codebase/test-cases.md
